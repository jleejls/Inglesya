<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InglesYa Desktop Structure - Screenshot Layout</title>
<style>
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial, Helvetica, sans-serif;
    background:#ffffff;
    color:#222;
  }
  .message{
    width:min(92vw,420px);
    border:1px solid #d0d0d0;
    border-radius:14px;
    padding:18px;
    text-align:center;
    box-shadow:0 4px 14px rgba(0,0,0,.12);
  }
</style>
</head>
<body>
  <div class="message">InglesYa desktop revised layout prepared</div>

<script>
(function(){
  /*
    DESKTOP SCREENSHOT LAYOUT
    structure.html writes all layout orders into sessionStorage.
    conductor.html only reads these orders and renders them.

    Main design:
    - 7 large pronoun frames: 4 across the top, 3 centered beneath.
    - 10 object frames: restored to side columns, five left and five right.
    - 2 expression/collateral circles: reduced and placed beside the button bar.
    - buttonStorage is included so conductor cannot stop with a missing-buttonStorage error.
  */

  const stageStyle = {
    position:"relative",
    width:"100vw",
    height:"calc(100vh - 64px)",
    maxWidth:"none",
    margin:"0",
    overflow:"hidden",
    boxSizing:"border-box",
    background:"#ffffff"
  };

  const pronounBox = {
    width:"242px",
    height:"242px",
    border:"1px solid #d7dbe3",
    borderRadius:"10px",
    background:"#f9fafb",
    overflow:"hidden",
    display:"flex",
    alignItems:"center",
    justifyContent:"center",
    boxSizing:"border-box"
  };

  const pronounImg = {
    width:"100%",
    height:"100%",
    objectFit:"contain",
    display:"block"
  };

  const objectBox = {
    width:"132px",
    height:"114px",
    border:"none",
    borderRadius:"7px",
    background:"transparent",
    boxShadow:"none",
    overflow:"visible",
    display:"flex",
    alignItems:"center",
    justifyContent:"center",
    boxSizing:"border-box"
  };

  const objectImg = {
    width:"100%",
    height:"100%",
    padding:"0",
    objectFit:"contain",
    display:"block"
  };

  const expressionBox = {
    width:"88px",
    height:"88px",
    border:"1px solid #d7dbe3",
    borderRadius:"50%",
    background:"#f9fafb",
    overflow:"hidden",
    display:"flex",
    alignItems:"center",
    justifyContent:"center",
    boxSizing:"border-box",
    position:"fixed",
    bottom:"12px",
    zIndex:"49"
  };

  const expressionImg = {
    width:"96%",
    height:"96%",
    borderRadius:"50%",
    objectFit:"cover",
    display:"block"
  };

  const stationStorage = {
    version:"inglesya-desktop-side-objects-pronouns-fill-space-objects-plus-20260709",
    layoutName:"desktop revised: side objects +5%, pronouns +15%, expressions closer to button bar",
    gridColumns:16,
    expressionPronounIds:[8,9],
    stageStyle:stageStyle,
    stations:[
      // Top row: 4 large pronoun frames
      { station:"station-01", group:"pronouns", id:1, shape:"rectangle", kind:"main", style:{...pronounBox, left:"calc(50vw - 499px)", top:"8px"}, imgStyle:pronounImg },
      { station:"station-02", group:"pronouns", id:2, shape:"rectangle", kind:"main", style:{...pronounBox, left:"calc(50vw - 247px)", top:"8px"}, imgStyle:pronounImg },
      { station:"station-03", group:"pronouns", id:3, shape:"rectangle", kind:"main", style:{...pronounBox, left:"calc(50vw + 5px)",   top:"8px"}, imgStyle:pronounImg },
      { station:"station-04", group:"pronouns", id:4, shape:"rectangle", kind:"main", style:{...pronounBox, left:"calc(50vw + 257px)", top:"8px"}, imgStyle:pronounImg },

      // Second row: 3 large pronoun frames, centered
      { station:"station-05", group:"pronouns", id:5, shape:"rectangle", kind:"main", style:{...pronounBox, left:"calc(50vw - 373px)", top:"258px"}, imgStyle:pronounImg },
      { station:"station-06", group:"pronouns", id:6, shape:"rectangle", kind:"main", style:{...pronounBox, left:"calc(50vw - 121px)", top:"258px"}, imgStyle:pronounImg },
      { station:"station-07", group:"pronouns", id:7, shape:"rectangle", kind:"main", style:{...pronounBox, left:"calc(50vw + 131px)", top:"258px"}, imgStyle:pronounImg },

      // Side object frames: returned to the left and right sides
      // Left side: object ids 1-5
      { station:"station-08", group:"objects", id:1,  shape:"rectangle", style:{...objectBox, left:"28px", top:"4px"},   imgStyle:objectImg },
      { station:"station-09", group:"objects", id:2,  shape:"rectangle", style:{...objectBox, left:"28px", top:"122px"}, imgStyle:objectImg },
      { station:"station-10", group:"objects", id:3,  shape:"rectangle", style:{...objectBox, left:"28px", top:"240px"}, imgStyle:objectImg },
      { station:"station-11", group:"objects", id:4,  shape:"rectangle", style:{...objectBox, left:"28px", top:"358px"}, imgStyle:objectImg },
      { station:"station-12", group:"objects", id:5,  shape:"rectangle", style:{...objectBox, left:"28px", top:"476px"}, imgStyle:objectImg },

      // Right side: object ids 6-10
      { station:"station-13", group:"objects", id:6,  shape:"rectangle", style:{...objectBox, right:"28px", top:"4px"},   imgStyle:objectImg },
      { station:"station-14", group:"objects", id:7,  shape:"rectangle", style:{...objectBox, right:"28px", top:"122px"}, imgStyle:objectImg },
      { station:"station-15", group:"objects", id:8,  shape:"rectangle", style:{...objectBox, right:"28px", top:"240px"}, imgStyle:objectImg },
      { station:"station-16", group:"objects", id:9,  shape:"rectangle", style:{...objectBox, right:"28px", top:"358px"}, imgStyle:objectImg },
      { station:"station-17", group:"objects", id:10, shape:"rectangle", style:{...objectBox, right:"28px", top:"476px"}, imgStyle:objectImg },

      // Expression/collateral circles: smaller, beside the button bar
      { station:"station-18", group:"pronouns", id:8, shape:"circle", kind:"expression", style:{...expressionBox, left:"220px"},  imgStyle:expressionImg },
      { station:"station-19", group:"pronouns", id:9, shape:"circle", kind:"expression", style:{...expressionBox, right:"220px"}, imgStyle:expressionImg }
    ]
  };

  const buttonBox = {
    border:"2px solid #4CAF50",
    borderRadius:"10px",
    width:"min(6.24vw, 75px)",
    height:"min(5.2vh, 42px)",
    minWidth:"56px",
    minHeight:"30px",
    display:"flex",
    alignItems:"center",
    justifyContent:"center",
    backgroundColor:"#d05000",
    cursor:"pointer",
    boxSizing:"border-box",
    overflow:"hidden",
    flex:"0 0 auto"
  };

  const buttonImg = {
    maxWidth:"100%",
    maxHeight:"100%",
    display:"block",
    pointerEvents:"none",
    objectFit:"contain"
  };

  const buttonStorage = {
    version:"inglesya-desktop-buttons-matched-to-platica-v2-20260709",
    barStyle:{
      display:"flex",
      flexDirection:"row",
      alignItems:"center",
      justifyContent:"center",
      gap:"0.55vw",
      position:"fixed",
      bottom:"2vh",
      left:"50%",
      transform:"translateX(-50%)",
      backgroundColor:"#f0f0f0",
      padding:"4px 6px",
      borderRadius:"10px",
      border:"1px solid #ddd",
      maxWidth:"96vw",
      overflow:"hidden",
      zIndex:"50"
    },
    buttons:[
      { id:"continue",   title:"Advance to next level",       label:"Adelante",   imgSrc:"../trigger/adelante.jpg",  alt:"Adelante",   style:buttonBox, imgStyle:buttonImg },
      { id:"exit",       title:"Exit",                        label:"Exit",       imgSrc:"../trigger/exit.jpg",      alt:"Exit",       style:buttonBox, imgStyle:buttonImg },
      { id:"choosel",    title:"Go to level selection",       label:"Levels",     imgSrc:"../trigger/choosel.jpg",   alt:"Levels",     style:buttonBox, imgStyle:buttonImg },
      { id:"help",       title:"Guidelines",                  label:"Help",       imgSrc:"../trigger/help.jpg",      alt:"Help",       style:buttonBox, imgStyle:buttonImg },
      { id:"donate",     title:"Donate",                      label:"Donate",     imgSrc:"../trigger/donate.jpg",    alt:"Donate",     style:buttonBox, imgStyle:buttonImg },
      { id:"email",      title:"Email information",           label:"Email",      imgSrc:"../trigger/email.jpg",     alt:"Email",      style:buttonBox, imgStyle:buttonImg },
      { id:"characters", title:"La Gente",                    label:"La Gente",   imgSrc:"../trigger/lagente.jpg",   alt:"La Gente",   style:buttonBox, imgStyle:buttonImg },
      { id:"translate",  title:"Translation",                 label:"Translate",  imgSrc:"../trigger/translate.jpg", alt:"Translate",  style:buttonBox, imgStyle:buttonImg }
    ]
  };

  const pronounSlots = [];
  for (let i = 1; i <= 9; i++) pronounSlots.push({ id:i, kind:i <= 7 ? "main" : "expression" });

  const objectSlots = [];
  for (let i = 1; i <= 10; i++) objectSlots.push({ id:i });

  sessionStorage.setItem("stationStorage", JSON.stringify(stationStorage));
  sessionStorage.setItem("buttonStorage", JSON.stringify(buttonStorage));
  sessionStorage.setItem("pronounSlots", JSON.stringify(pronounSlots));
  sessionStorage.setItem("objectSlots", JSON.stringify(objectSlots));
  sessionStorage.setItem("expressionSlots", JSON.stringify([{ id:8 }, { id:9 }]));
  sessionStorage.setItem("expressionPronounIds", JSON.stringify(stationStorage.expressionPronounIds));
  sessionStorage.setItem("inglesyaStructureReady", "true");
  sessionStorage.setItem("inglesyaLane", "desktop");
  localStorage.setItem("inglesyaLane", "desktop");

  if (!sessionStorage.getItem("tense")) sessionStorage.setItem("tense", "now");

  const params = new URLSearchParams(window.location.search);
  const requestedLesson =
    params.get("lesson") ||
    params.get("selectedLesson") ||
    sessionStorage.getItem("selectedLesson") ||
    sessionStorage.getItem("lesson") ||
    sessionStorage.getItem("currentLesson") ||
    localStorage.getItem("selectedLesson") ||
    localStorage.getItem("lesson") ||
    localStorage.getItem("currentLesson") ||
    "1";

  const firstTime =
    params.get("firstTime") === "1" ||
    params.get("autoStartLevel1") === "1" ||
    sessionStorage.getItem("autoStartLevel1") === "yes" ||
    sessionStorage.getItem("firstTimeStart") === "yes" ||
    localStorage.getItem("autoStartLevel1") === "yes" ||
    localStorage.getItem("firstTimeStart") === "yes";

  const n = Number(requestedLesson);
  const lessonToOpen = firstTime ? "1" : (Number.isFinite(n) && n >= 1 && n <= 20 ? String(n) : "1");

  sessionStorage.setItem("lesson", lessonToOpen);
  sessionStorage.setItem("selectedLesson", lessonToOpen);
  sessionStorage.setItem("currentLesson", lessonToOpen);
  sessionStorage.setItem("desktopMode", "1");
  sessionStorage.removeItem("phoneMode");
  sessionStorage.removeItem("autoStartLevel1");
  sessionStorage.removeItem("firstTimeStart");

  localStorage.setItem("lesson", lessonToOpen);
  localStorage.setItem("selectedLesson", lessonToOpen);
  localStorage.setItem("currentLesson", lessonToOpen);
  localStorage.removeItem("autoStartLevel1");
  localStorage.removeItem("firstTimeStart");

  window.location.replace("conductor.html?lesson=" + encodeURIComponent(lessonToOpen) + "&prep=" + Date.now());
})();
</script>
</body>
</html>
