<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lesson Select</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:#f5f7fb;color:#222}
  header{padding:16px 20px;background:#1e293b;color:#fff;font-weight:600}
  main{max-width:960px;margin:0 auto;padding:16px}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .col{display:grid;gap:12px}
  button.lesson-btn{width:100%;text-align:left;padding:14px 16px;border:1px solid #d7dbe3;border-radius:12px;background:#fff;cursor:pointer}
  button.lesson-btn:hover{box-shadow:0 2px 12px rgba(0,0,0,.06)}
  @media (max-width:640px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>Pick a lesson</header>
<main>
  <div id="pick" class="grid" aria-live="polite"></div>
</main>

<button onclick="startLesson(1)">Lesson 1 - have</button>
<button onclick="startLesson(2)">Lesson 2 - want</button>
<button onclick="startLesson(3)">Lesson 3 - say</button>
<button onclick="startLesson(4)">Lesson 4 - be</button>
<button onclick="startLesson(5)">Lesson 5 - need</button>
<button onclick="startLesson(6)">Lesson 6 - go </button>
<button onclick="startLesson(7)">Lesson 7 - know</button>
<button onclick="startLesson(8)">Lesson 8 - come</button>
<button onclick="startLesson(9)">Lesson 9 - say</button>
<button onclick="startLesson(10)">Lesson 10</button>
<button onclick="startLesson(11)">Lesson 11 - speak</button>
<button onclick="startLesson(12)">Lesson 12 - see</button>
<button onclick="startLesson(13)">Lesson 13</button>
<button onclick="startLesson(14)">Lesson 14 - can</button>
<button onclick="startLesson(15)">Lesson 15 - live</button>
<button onclick="startLesson(16)">Lesson 16 - have</button>
<button onclick="startLesson(17)">Lesson 17 - give</button>
<button onclick="startLesson(18)">Lesson 18 - put</button>
<button onclick="startLesson(19)">Lesson 19 make</button>
<button onclick="startLesson(20)">Lesson 20</button>

<script>
function startLesson(num) {
  sessionStorage.setItem("lesson", num);
  sessionStorage.setItem("tense", "now"); // you can change later
  window.location.href = "conductor.html";
}
</script>

</body>
</html>
