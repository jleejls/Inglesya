<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InglesYa Phone Structure</title>
<style>
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial, Helvetica, sans-serif;
    background:#ffffff;
    color:#222;
  }
  .message{
    width:min(92vw,420px);
    border:1px solid #d0d0d0;
    border-radius:14px;
    padding:18px;
    text-align:center;
    box-shadow:0 4px 14px rgba(0,0,0,.12);
  }
</style>
</head>
<body>
  <div class="message">Preparing the phone structure...</div>

<script>
(function(){
  // This page defines the phone frame stations. The phone conductor reads
  // stationStorage and renders exactly these stations.
  // Layout: 3 pronouns, 4 pronouns, 3 objects, 4 objects, 3 objects, 2 circles.
  const phoneStructure = {
    version: "sps-phone-clean-3-4-3-4-3-plus-2-circles-20260624",
    layoutName: "3-4-3-4-3 + 2 circle frames",
    gridColumns: 8,
    rows: [3, 4, 3, 4, 3, 2],
    expressionPronounIds: [8, 9],
    stations: [
      { station:"station-01", group:"pronouns", id:1, row:1, gridColumn:"2 / span 2", shape:"rectangle", kind:"main" },
      { station:"station-02", group:"pronouns", id:2, row:1, gridColumn:"4 / span 2", shape:"rectangle", kind:"main" },
      { station:"station-03", group:"pronouns", id:3, row:1, gridColumn:"6 / span 2", shape:"rectangle", kind:"main" },

      { station:"station-04", group:"pronouns", id:4, row:2, gridColumn:"1 / span 2", shape:"rectangle", kind:"main" },
      { station:"station-05", group:"pronouns", id:5, row:2, gridColumn:"3 / span 2", shape:"rectangle", kind:"main" },
      { station:"station-06", group:"pronouns", id:6, row:2, gridColumn:"5 / span 2", shape:"rectangle", kind:"main" },
      { station:"station-07", group:"pronouns", id:7, row:2, gridColumn:"7 / span 2", shape:"rectangle", kind:"main" },

      { station:"station-08", group:"objects",  id:1,  row:3, gridColumn:"2 / span 2", shape:"rectangle" },
      { station:"station-09", group:"objects",  id:2,  row:3, gridColumn:"4 / span 2", shape:"rectangle" },
      { station:"station-10", group:"objects",  id:3,  row:3, gridColumn:"6 / span 2", shape:"rectangle" },

      { station:"station-11", group:"objects",  id:4,  row:4, gridColumn:"1 / span 2", shape:"rectangle" },
      { station:"station-12", group:"objects",  id:5,  row:4, gridColumn:"3 / span 2", shape:"rectangle" },
      { station:"station-13", group:"objects",  id:6,  row:4, gridColumn:"5 / span 2", shape:"rectangle" },
      { station:"station-14", group:"objects",  id:7,  row:4, gridColumn:"7 / span 2", shape:"rectangle" },

      { station:"station-15", group:"objects",  id:8,  row:5, gridColumn:"2 / span 2", shape:"rectangle" },
      { station:"station-16", group:"objects",  id:9,  row:5, gridColumn:"4 / span 2", shape:"rectangle" },
      { station:"station-17", group:"objects",  id:10, row:5, gridColumn:"6 / span 2", shape:"rectangle" },

      { station:"station-18", group:"pronouns", id:8, row:6, gridColumn:"3 / span 2", shape:"circle", kind:"expression" },
      { station:"station-19", group:"pronouns", id:9, row:6, gridColumn:"5 / span 2", shape:"circle", kind:"expression" }
    ]
  };

  // Compatibility storage for any older desktop/V2 logic that looks for slots.
  const pronounSlots = [];
  for (let i = 1; i <= 9; i++) pronounSlots.push({ id: i, kind: i <= 7 ? "main" : "expression" });
  const objectSlots = [];
  for (let i = 1; i <= 10; i++) objectSlots.push({ id: i });

  // Bottom program button structure belongs here, not in conductor.html.
  // The conductor only reads this storage and renders what this structure page defines.
  const buttonStorage = {
    version: "inglesya-phone-bottom-buttons-20260629",
    lane: "phone",
    bar: { id:"pbar", className:"zipbutton", ariaLabel:"Program buttons" },
    buttons: [
      { action:"continue", title:"Advance to next page", image:"../trigger/adelante.jpg", alt:"Advance" },
      { action:"exit", title:"Exit", image:"../trigger/exit.jpg", alt:"Exit" },
      { action:"choosel", title:"Choose lesson", image:"../trigger/choosel.jpg", alt:"Choose lesson" },
      { action:"help", title:"Help / guidelines", image:"../trigger/help.jpg", alt:"Help" },
      { action:"donate", title:"Donate", image:"../trigger/donate.jpg", alt:"Donate" },
      { action:"email", title:"Contact Jimmy Lucky", image:"../trigger/email.jpg", alt:"Email" },
      { action:"goback", title:"La Gente", image:"../trigger/lagente.jpg", alt:"La Gente" },
      { action:"translate", title:"Translation", image:"../trigger/translate.jpg", alt:"Translate" }
    ],
    cssVars: {
      "--button-bar-bottom": "5px",
      "--button-bar-width": "calc(100vw - 14px)",
      "--button-bar-max-width": "500px",
      "--button-bar-gap": "1px",
      "--button-bar-padding": "2px",
      "--button-bar-justify": "space-between",
      "--button-width": "10.1vw",
      "--button-height": "37px",
      "--button-min-width": "0",
      "--button-min-height": "32px",
      "--button-border-width": "1px",
      "--button-border-radius": "8px"
    }
  };

  sessionStorage.setItem("stationStorage", JSON.stringify(phoneStructure));
  sessionStorage.setItem("buttonStorage", JSON.stringify(buttonStorage));
  sessionStorage.setItem("pronounSlots", JSON.stringify(pronounSlots));
  sessionStorage.setItem("objectSlots", JSON.stringify(objectSlots));
  sessionStorage.setItem("expressionSlots", JSON.stringify([{ id:8 }, { id:9 }]));
  sessionStorage.setItem("expressionPronounIds", JSON.stringify(phoneStructure.expressionPronounIds));
  sessionStorage.setItem("inglesyaStructureReady", "true");
  sessionStorage.setItem("inglesyaLane", "phone");
  localStorage.setItem("inglesyaLane", "phone");

  if (!sessionStorage.getItem("tense")) sessionStorage.setItem("tense", "now");

  const params = new URLSearchParams(window.location.search);
  const shouldAutoStartLevel1 =
    params.get("autoStartLevel1") === "1" ||
    sessionStorage.getItem("autoStartLevel1") === "yes" ||
    sessionStorage.getItem("firstTimeStart") === "yes" ||
    localStorage.getItem("autoStartLevel1") === "yes" ||
    localStorage.getItem("firstTimeStart") === "yes";

  if (shouldAutoStartLevel1) {
    sessionStorage.setItem("lesson", "1");
    sessionStorage.setItem("selectedLesson", "1");
    sessionStorage.setItem("currentLesson", "1");
    localStorage.setItem("lesson", "1");
    localStorage.setItem("selectedLesson", "1");
    localStorage.setItem("currentLesson", "1");
    sessionStorage.removeItem("autoStartLevel1");
    sessionStorage.removeItem("firstTimeStart");
    localStorage.removeItem("autoStartLevel1");
    localStorage.removeItem("firstTimeStart");
    window.location.replace("conductor.html?lesson=1&prep=" + Date.now());
    return;
  }

  if (!sessionStorage.getItem("lesson") && !sessionStorage.getItem("selectedLesson")) {
    sessionStorage.setItem("lesson", "1");
    sessionStorage.setItem("selectedLesson", "1");
  }

  window.location.replace("lessonselect.html");
})();
</script>
</body>
</html>
