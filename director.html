<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>director.html</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{
    margin:0;
    font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;
    background:#ffffff;
    color:#222;
  }
  header{
    padding:10px 14px;
    background:#6b1111;
    color:#fff;
    font-weight:600;
    font-size:15px;
  }
  main{
    max-width:1440px;
    margin:0 auto;
    padding:12px 12px 72px;
  }
  h3{
    margin:8px 4px;
    font-size:15px;
  }

  .director-grid{
    display:grid;
    grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr) minmax(0,.8fr);
    gap:6px;
    align-items:flex-start;
  }
  .director-column{ min-width:0; }

  @media (max-width:900px){
    .director-grid{ grid-template-columns:1fr; }
  }

  .pronoun-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:3px;
  }

  .object-col{
    display:flex;
    flex-direction:column;
    gap:3px;
  }

 
  .tile{
    position:relative;
    border:1px solid #d7dbe3;
    border-radius:10px;
    overflow:hidden;
    cursor:pointer;
    background:#f9fafb;
    aspect-ratio:3/4;
     /*size of frame*/
    max-height:150px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /*size of object frame*/
  #objLeft .tile,
  #objRight .tile{
    max-height:90px;
    aspect-ratio:1/1;
  }

  .tile img{
    max-width:100%;
    max-height:100%;
    display:block;
  }

  #objLeft .tile img,
  #objRight .tile img{
    max-width:60%;
    max-height:60%;
  }

  .label{
    font:11px/1.2 monospace;
    color:#555;
    text-align:center;
    padding:4px;
    white-space:pre-line;
  }

  .foot{
    position:fixed;
    left:8px;
    bottom:48px;
    background:#ffe8a3;
    border-radius:8px;
    padding:4px 6px;
    font:10px/1.2 monospace;
  }

  @media (max-width:600px){
    main{ padding-bottom:88px; }
  }
/* ----- Trigger bar ----- */
.trigger-bar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  padding:6px 8px;
  background:rgba(255,255,255,.96);
  box-shadow:0 -2px 10px rgba(0,0,0,.08);
  display:flex;
  justify-content:center;
  gap:6px;
  z-index:1000;
}

.trigger-btn{
  width:54px;
  height:54px;
  border:1px solid #cfd6df;
  border-radius:10px;
  background:#f8f9fb;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  cursor:pointer;
  padding:0;
}

.trigger-btn img{
  max-width:100%;
  max-height:100%;
  display:block;
}

.trigger-bar{
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 6px 8px;
}

.trigger-btn{
  width: 48px;
  height: 48px;
  padding: 0;
  border: none;
  background: transparent;
  cursor: pointer;
}

.trigger-btn img{
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
    .trigger-bar{
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 6px 8px;
    }

    .trigger-btn{
      width: 48px;
      height: 48px;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
    }

    .trigger-btn img{
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
</style>
</head>
<body>
<header id="banner">Director</header>

<main>
  <div class="director-grid">
    <section class="director-column">
      <h3>Objects</h3>
      <div id="objLeft" class="object-col"></div>
    </section>

    <section class="director-column">
      <h3>Pronouns</h3>
      <div id="pronouns" class="pronoun-grid"></div>
    </section>

    <section class="director-column">
      <h3>&nbsp;</h3>
      <div id="objRight" class="object-col"></div>
    </section>
  </div>
</main>

<audio id="player" preload="auto"></audio>
<div id="triggerBar" class="trigger-bar"></div>
<script>
(function(){
  // ----- Session data -----
  const pronounSlots = JSON.parse(sessionStorage.getItem("pronounSlots") || "[]");
  const objectSlots  = JSON.parse(sessionStorage.getItem("objectSlots")  || "[]");
  const exprIds      = JSON.parse(sessionStorage.getItem("expressionPronounIds") || "[]");

  const tense = sessionStorage.getItem("tense") || "now";
  let lesson = Number(sessionStorage.getItem("lesson") || "1");
  if (!lesson || Number.isNaN(lesson)) lesson = 1;

  // ----- Fallback layout -----
  if (!pronounSlots.length) {
    for (let i = 1; i <= 9; i++) {
      pronounSlots.push({ id: i, kind: i <= 7 ? "main" : "expression" });
    }
  }

  if (!objectSlots.length) {
    for (let i = 1; i <= 10; i++) {
      objectSlots.push({ id: i, column: i <= 5 ? 1 : 2 });
    }
  }

  const basePath = `./group/lesson${lesson}`;
  document.getElementById("banner").textContent = `Director — ${basePath}`;

  // ----- Asset paths -----
  const pronImg = i => `${basePath}/pronouns/images/p${i}.png`;
  const objImg  = i => `${basePath}/objects/images/p${i}.png`;
  const pronAud = i => `${basePath}/pronouns/audios/a${i}.m4a`;
  const objAud  = i => `${basePath}/objects/audios/a${i}.m4a`;
  const trigImg = i => `./trigger/p${i}.png`;

  // ----- Builders -----
  function makeTile(src, fallbackLabel){
    const d = document.createElement("div");
    d.className = "tile";

    const img = document.createElement("img");
    img.src = src;
    img.alt = fallbackLabel;

    img.onerror = () => {
      d.innerHTML = `<div class="label">missing:\n${fallbackLabel}</div>`;
    };

    d.appendChild(img);
    return d;
  }

  // ----- Pronouns -----
  const pronMount = document.getElementById("pronouns");
  pronounSlots.forEach(slot => {
    const t = makeTile(pronImg(slot.id), `p${slot.id}.png`);
    t.dataset.group = "pronouns";
    t.dataset.index = slot.id;
    t.dataset.kind = slot.kind || "main";
    pronMount.appendChild(t);
  });

  // ----- Objects -----
  const leftCol = document.getElementById("objLeft");
  const rightCol = document.getElementById("objRight");

  objectSlots.forEach(slot => {
    const t = makeTile(objImg(slot.id), `p${slot.id}.png`);
    t.dataset.group = "objects";
    t.dataset.index = slot.id;

console.log("pronMount =", pronMount);
console.log("leftCol =", leftCol);
console.log("rightCol =", rightCol);


    if (slot.column === 1) {
      leftCol.appendChild(t);
    } else {
      rightCol.appendChild(t);
    }
  });

// ----- Trigger buttons -----
const triggerBar = document.getElementById("triggerBar");

for (let i = 1; i <= 8; i++) {
  const b = document.createElement("button");
  b.className = "trigger-btn";
  b.type = "button";

  const img = document.createElement("img");
img.src = trigImg(i);
img.alt = `Trigger ${i}`;

img.onerror = () => {
  b.textContent = `T${i}`;
};

b.appendChild(img);

if (i === 1) {
  b.onclick = () => {
    lesson = lesson + 1;
    sessionStorage.setItem("lesson", String(lesson));
    window.location.href = "director.html";
  };
}
if (i === 2) {
  b.onclick = () => {
    window.location.href = "about:blank";
  };
}

if (i === 3) {
  b.onclick = () => {
    window.location.href = "lesson_select.html";
  };
}

if (i === 7) {
  b.onclick = () => {
  //  sessionStorage.setItem("lesson5");
    window.location.href = "lagente.html";
  };
}
if (i === 8) {
  b.onclick = function () {
    const lesson = sessionStorage.getItem("lesson") || "1";
    const a = new Audio(`./group/
    }/translation/1.m4a`);
    a.play();
  };
}

triggerBar.appendChild(b);
}

  // ----- Debug badge -----
  console.log("pronMount =", pronMount);
console.log("leftCol =", leftCol);
console.log("rightCol =", rightCol);

  const foot = document.createElement("div");
  foot.className = "foot";
  foot.textContent = `tense=${tense}  lesson=${lesson}`;
  
  document.body.appendChild(foot);

  // ----- Audio logic -----
  const player = document.getElementById("player");
  let lastPronSrc = null;
  let lastPronJoinable = false;
  let playToken = 0;

  function isExpressionPronoun(index){
    return exprIds.includes(index);
  }

  function playSequence(sources){
    playToken++;
    const myToken = playToken;
    let i = 0;

    function next(){
      if (myToken !== playToken) return;
      if (i >= sources.length) return;
      const src = sources[i++];
      player.src = src;
      player.currentTime = 0;
      player.play().catch(err => {
        console.log("play failed:", err);
      });
    }

    player.onended = () => {
      if (myToken !== playToken) return;
      next();
    };

    next();
  }

  document.addEventListener("click", ev => {
    const el = ev.target.closest(".tile[data-group][data-index]");
    if (!el) return;

    const group = el.dataset.group;
    const index = Number(el.dataset.index);

    if (group === "pronouns") {
      const src = pronAud(index);

      if (isExpressionPronoun(index)) {
        lastPronSrc = null;
        lastPronJoinable = false;
        playSequence([src]);
      } else {
        lastPronSrc = src;
        lastPronJoinable = true;
        playSequence([src]);
      }
      return;
    }

    if (group === "objects") {
      const srcObj = objAud(index);

      if (lastPronSrc && lastPronJoinable) {
        playSequence([lastPronSrc, srcObj]);
        lastPronSrc = null;
        lastPronJoinable = false;
      } else {
        playSequence([srcObj]);
      }
      return;
    }
  });

  console.log("Lesson:", lesson);
  console.log("Tense:", tense);
})();
</script>

</body>
</html>
